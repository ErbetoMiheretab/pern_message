services:
  postgres_test:
    image: postgres:17-alpine
    container_name: postgres_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: MessageTest
    ports:
      - "5540:5432"
    profiles: ["test"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_test:
    image: redis:7-alpine
    container_name: message_redis_test
    command: ["redis-server", "--requirepass", "admin123"]
    environment:
      REDIS_PASSWORD: admin123
    ports:
      - "6383:6379"
    profiles: ["test"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data: {}
  redis_data: {}